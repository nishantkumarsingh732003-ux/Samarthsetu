name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  rules:
    name: Eligibility engine (Python + TypeScript conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pyyaml pytest ruff
      - run: ruff check packages/rules
      - run: pytest packages/rules -q
      # No `version:` here on purpose. `packageManager: pnpm@9.12.0` in the root
      # package.json is the single source of truth, so CI and a developer's machine run
      # the same pnpm. action-setup@v4 now *errors* when it is told a version as well —
      # "Multiple versions of pnpm specified" — rather than picking one, so declaring it
      # in both places fails the build.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: pnpm}
      - run: pnpm install --frozen-lockfile=false
      # Proves the browser engine and the API engine agree on every golden case.
      - run: pnpm --filter @setu/rules typecheck
      - run: pnpm --filter @setu/rules test

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r apps/api/requirements-dev.txt
      # The eligibility engine is a shared package, not API code, and the API imports it
      # as `setu_rules`. The Dockerfile installs it the same way for the same reason, so
      # CI runs the exact rules the container runs rather than a path-hacked copy.
      # Without this the suite fails at collection with ModuleNotFoundError.
      - run: pip install -e packages/rules
      - run: cd apps/api && ruff check .
      - run: cd apps/api && pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. `packageManager: pnpm@9.12.0` in the root
      # package.json is the single source of truth, so CI and a developer's machine run
      # the same pnpm. action-setup@v4 now *errors* when it is told a version as well —
      # "Multiple versions of pnpm specified" — rather than picking one, so declaring it
      # in both places fails the build.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: pnpm}
      - run: pnpm install --frozen-lockfile=false
      # Translation completeness, no hardcoded copy, and WCAG AA contrast across the
      # whole palette — not just the colours that happen to be on one audited page.
      - run: pnpm --filter @setu/web check:i18n
      - run: pnpm --filter @setu/web check:contrast
      - run: pnpm --filter @setu/web lint
      - run: pnpm --filter @setu/web build
      # The citizen JS budget (CLAUDE.md rule 5) fails the build rather
      # than being a number nobody looks at.
      - run: pnpm --filter @setu/web check:bundle
