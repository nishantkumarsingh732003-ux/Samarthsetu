name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  rules:
    name: Eligibility engine (Python + TypeScript conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pyyaml pytest ruff
      - run: ruff check packages/rules
      - run: pytest packages/rules -q
      - uses: pnpm/action-setup@v4
        with: {version: 9}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: pnpm}
      - run: pnpm install --frozen-lockfile=false
      # Proves the browser engine and the API engine agree on every golden case.
      - run: pnpm --filter @setu/rules typecheck
      - run: pnpm --filter @setu/rules test

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r apps/api/requirements-dev.txt
      - run: cd apps/api && ruff check .
      - run: cd apps/api && pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: pnpm}
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @setu/web lint
      - run: pnpm --filter @setu/web build
