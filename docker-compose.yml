services:
  postgres:
    build: ./infra/docker/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saarthi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saarthi}
      POSTGRES_DB: ${POSTGRES_DB:-saarthi}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/seed/00_extensions.sql:/docker-entrypoint-initdb.d/00_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saarthi}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    # Repo-root context so the image can install packages/rules, the shared engine.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      # .env targets localhost for running the API outside Docker; inside the network
      # the services are reachable by name.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-saarthi}:${POSTGRES_PASSWORD:-saarthi}@postgres:5432/${POSTGRES_DB:-saarthi}
      REDIS_URL: redis://redis:6379/0
      # Let the shell environment override .env for the model settings, so a key can be
      # supplied by CI or a deploy secret store without being written to a file.
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # Redacted document bytes. A named volume, not a bind mount: these are citizen
      # documents and they do not belong in the working tree.
      # Overridable from the shell so `scripts/bench.py` can measure the service rather
      # than measuring our own rate limiter. Defaults to on.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      STORAGE_DIR: /data/uploads
      ID_HASH_SALT: ${ID_HASH_SALT:-}
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    volumes:
      - ./apps/api:/app
      - ./packages/rules:/packages/rules
      - ./scripts:/scripts
      - uploads:/data/uploads

  web:
    build: ./apps/web
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [api]
    volumes:
      - ./apps/web:/app
      # Anonymous volumes so the container keeps its own copies of these two rather than
      # sharing the host's. `node_modules` was always masked — a Linux container cannot
      # use a Windows/macOS install. `.next` has to be masked for the same reason and was
      # not: running `pnpm --filter @setu/web check` on the host writes a *production*
      # build into the mounted directory, the container's `next dev` then serves its own
      # dev manifest against those chunks, and the browser gets
      # "TypeError: Cannot read properties of undefined (reading 'call')" out of
      # webpack.js with no indication of why. Two build systems, one directory.
      - /app/node_modules
      - /app/.next
    # `next dev` compiles each route on demand and re-reads its module graph across the
    # bind mount on every request. Measured on this machine: 1-5s per page in dev against
    # ~80ms for the same pages from a production build — the app is not slow, the dev
    # server is. `WEB_CMD` exists so a demo does not have to be given at dev speed.
    command: ${WEB_CMD:-pnpm dev}

  # The same image, built and served rather than compiled per request. Use it when the
  # speed of the thing is being judged:
  #
  #     docker compose --profile demo up web-prod
  #
  # It listens on 3001 so it can run beside the dev server rather than fighting it for
  # port 3000, and it keeps its own `.next` for the reason the note above gives.
  web-prod:
    profiles: [demo]
    build: ./apps/web
    env_file: .env
    ports: ["3001:3000"]
    depends_on: [api]
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "pnpm build && pnpm start"

volumes:
  pgdata:
  uploads:
