[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "setu-rules"
version = "1.0.0"
description = "SETU deterministic scheme eligibility engine and versioned rule pack"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/setu_rules"]

[tool.hatch.build.targets.wheel.force-include]
"schemes" = "setu_rules/schemes"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
