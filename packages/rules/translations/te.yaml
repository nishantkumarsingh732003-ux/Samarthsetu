      టర్మ్ లోన్ Rs 1,40,000 కంటే ఎక్కువ ఖర్చయ్యే యూనిట్ల కోసం. చిన్న ప్రాజెక్టుల కోసం
      మైక్రో ఫైనాన్స్ పథకం ఉంది.
    satisfied: "మీ ప్రాజెక్ట్ ఈ పథకానికి తగినంత పెద్దది."
  TL_PROJECT_COST_CEILING:
    message: "టర్మ్ లోన్ Rs 50,00,000 వరకు ఖర్చయ్యే యూనిట్ల కోసం."
