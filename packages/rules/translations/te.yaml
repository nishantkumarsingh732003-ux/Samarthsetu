rules:
  MF_CATEGORY_SC:
    message: "ఈ పథకం షెడ్యూల్డ్ కులం దరఖాస్తుదారుల కోసం."
    satisfied: "మీరు షెడ్యూల్డ్ కులం దరఖాస్తుదారు."
  MF_INCOME_CEILING:
    message: "వార్షిక కుటుంబ ఆదాయం Rs 5,00,000 మించకూడదు."
    satisfied: "మీ వార్షిక కుటుంబ ఆదాయం Rs 5,00,000 పరిమితిలో ఉంది."
  MF_NOT_FOR_EDUCATION:
    message: "విద్యా ఖర్చులు విద్యా రుణ పథకం కింద అందించబడతాయి, ఈ పథకం కింద కాదు."
    satisfied: "మీ అవసరం ఒక వ్యాపార ప్రాజెక్ట్, దీనికి ఈ పథకం ఆర్థిక సహాయం చేస్తుంది."
  MF_PROJECT_COST_BAND:
    message: "మైక్రో ఫైనాన్స్ పథకం Rs 1,40,000 వరకు ఖర్చయ్యే యూనిట్ల కోసం."
    satisfied: "మీ ప్రాజెక్ట్ ఖర్చు Rs 1,40,000 పరిమితిలో ఉంది."
  MF_LOAN_CAP_BINDS:
    message: >-
      ఈ పథకం గరిష్ఠంగా Rs 1,25,000 రుణం ఇస్తుంది, ఇది మీ ప్రాజెక్ట్ ఖర్చులో 90% కంటే
      తక్కువ. మిగిలిన మొత్తాన్ని మీరే సమకూర్చుకోవాలి.
    satisfied: "ఈ పథకం మీ ప్రాజెక్ట్ ఖర్చులో పూర్తి 90% ఆర్థిక సహాయం చేయగలదు."
  TL_CATEGORY_SC:
    message: "ఈ పథకం షెడ్యూల్డ్ కులం దరఖాస్తుదారుల కోసం."
    satisfied: "మీరు షెడ్యూల్డ్ కులం దరఖాస్తుదారు."
