  age: "మీ వయస్సు ఎంత?"
  gender: "మీ లింగం ఏమిటి?"
  has_caste_certificate: "మీ దగ్గర కుల ధ్రువీకరణ పత్రం ఉందా?"
  existing_loans: "ఇతర రుణాలపై మీపై ఎంత బకాయి ఉంది?"
  occupation_type: "మీరు ఏ పని చేస్తారు?"
  education_level: "మీరు ఎంత వరకు చదివారు?"
  sub_category: "ఏదైనా ఉప-వర్గం ఉందా?"
  is_pwd: "మీరు దివ్యాంగులా?"
  is_safai_karamchari: "మీరు పారిశుద్ధ్య కార్మికులా లేదా వారిపై ఆధారపడినవారా?"

ui:
  eligible: "మీరు {scheme} కు అర్హులు."
  need_more_info: "{scheme} గురించి చెప్పడానికి మాకు కొంత అదనపు సమాచారం కావాలి."
  ineligible: "ప్రస్తుతం మీరు {scheme} కు అర్హులు కాదు."
  amount: "ఈ పథకం కింద గరిష్ఠంగా సుమారు Rs {amount} వరకు రుణం సాధ్యం కావచ్చు."
  redirect: "మీరు {scheme} గురించి అడగవచ్చు."
  still_need: "మేము దీన్ని తెలుసుకోవాలి: {fields}."
  confirm_income: "మీ వార్షిక కుటుంబ ఆదాయం సుమారు {value} అని అర్థమైంది — ఇది సరైనదా?"
  confirm_cost: "మీకు సుమారు {value} కావాలని అర్థమైంది — ఇది సరైనదా?"
  confirm_loans: "ఇతర రుణాలపై సుమారు {value} బకాయి ఉందని అర్థమైంది — ఇది సరైనదా?"
  confirm_generic: "{field} అనేది {value} అని అర్థమైంది — ఇది సరైనదా?"

