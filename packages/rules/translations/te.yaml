fields:
  category: "మీరు ఏ సామాజిక వర్గానికి చెందినవారు?"
  project_sector: "మీకు దేని కోసం డబ్బు కావాలి?"
  annual_family_income: "మీ కుటుంబ మొత్తం వార్షిక ఆదాయం ఎంత?"
