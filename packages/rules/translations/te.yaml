  EL_PURPOSE_IS_EDUCATION:
    message: "ఈ పథకం విద్యా ఖర్చుల కోసం మాత్రమే."
    satisfied: "మీకు విద్య కోసం ఆర్థిక సహాయం కావాలి, ఈ పథకం దాని కోసమే."
  EL_ADMISSION_CONFIRMED:
    message: "విద్యా రుణానికి నిర్ధారిత ప్రవేశం అవసరం."
    satisfied: "మీ ప్రవేశం నిర్ధారించబడింది."
  EL_LOAN_CAP_BINDS:
    message: >-
      ఈ పథకం గరిష్ఠంగా Rs 40,00,000 రుణం ఇస్తుంది, ఇది మీ కోర్సు ఖర్చులో 90% కంటే
