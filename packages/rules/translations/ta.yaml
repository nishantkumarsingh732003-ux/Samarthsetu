rules:
  MF_CATEGORY_SC:
    message: "இந்தத் திட்டம் பட்டியலின சாதி விண்ணப்பதாரர்களுக்கானது."
    satisfied: "நீங்கள் பட்டியலின சாதி விண்ணப்பதாரர்."
  MF_INCOME_CEILING:
    message: "ஆண்டு குடும்ப வருமானம் Rs 5,00,000 ஐ மிஞ்சக் கூடாது."
