    message: "கல்விச் செலவுகள் கல்விக் கடன் திட்டத்தின் கீழ் வழங்கப்படுகின்றன, இதன் கீழ் அல்ல."
    satisfied: "உங்கள் தேவை ஒரு தொழில் திட்டம், அதற்கு இந்தத் திட்டம் நிதியளிக்கிறது."
