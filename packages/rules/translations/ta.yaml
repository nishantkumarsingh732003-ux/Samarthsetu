fields:
  category: "நீங்கள் எந்தச் சமூகப் பிரிவைச் சேர்ந்தவர்?"
  project_sector: "உங்களுக்கு எதற்காகப் பணம் தேவை?"
  annual_family_income: "உங்கள் குடும்பத்தின் மொத்த ஆண்டு வருமானம் எவ்வளவு?"
  project_cost: "உங்களுக்கு மொத்தம் எவ்வளவு பணம் தேவை?"
  admission_confirmed: "உங்கள் சேர்க்கை உறுதிசெய்யப்பட்டுள்ளதா?"
  age: "உங்கள் வயது என்ன?"
  gender: "உங்கள் பாலினம் என்ன?"
  has_caste_certificate: "உங்களிடம் சாதிச் சான்றிதழ் உள்ளதா?"
  existing_loans: "மற்ற கடன்களில் உங்களிடம் எவ்வளவு நிலுவை உள்ளது?"
  occupation_type: "நீங்கள் என்ன வேலை செய்கிறீர்கள்?"
  education_level: "நீங்கள் எவ்வளவு தூரம் படித்துள்ளீர்கள்?"
  sub_category: "ஏதேனும் துணைப் பிரிவு உள்ளதா?"
  is_pwd: "நீங்கள் மாற்றுத்திறனாளியா?"
  is_safai_karamchari: "நீங்கள் துப்புரவுப் பணியாளரா அல்லது அவர்களைச் சார்ந்தவரா?"

ui:
  eligible: "நீங்கள் {scheme} க்குத் தகுதியானவர்."
  need_more_info: "{scheme} பற்றிச் சொல்ல எங்களுக்குச் சில கூடுதல் தகவல்கள் தேவை."
  ineligible: "தற்போது நீங்கள் {scheme} க்குத் தகுதியில்லை."
  amount: "இந்தத் திட்டத்தின் கீழ் அதிகபட்சம் சுமார் Rs {amount} வரை கடன் சாத்தியமாகலாம்."
  redirect: "நீங்கள் {scheme} பற்றிக் கேட்கலாம்."
  still_need: "நாங்கள் இதை அறிய வேண்டும்: {fields}."
  confirm_income: "உங்கள் ஆண்டு குடும்ப வருமானம் சுமார் {value} என்று புரிந்துகொண்டேன் — சரியா?"
  confirm_cost: "உங்களுக்குச் சுமார் {value} தேவை என்று புரிந்துகொண்டேன் — சரியா?"
  confirm_loans: "மற்ற கடன்களில் சுமார் {value} நிலுவை உள்ளது என்று புரிந்துகொண்டேன் — சரியா?"
  confirm_generic: "{field} என்பது {value} என்று புரிந்துகொண்டேன் — சரியா?"
  assistant_offline: "உங்கள் பதில்களின்படி {scheme} உங்களுக்குப் பொருந்துகிறது. அதைத் திறந்து, இதைத் தீர்மானித்த விதியையும், அதைச் செயல்படுத்த அங்கீகரிக்கப்பட்ட பங்குதாரர்களையும் பாருங்கள்."
  assistant_offline_none: "இதற்கான பதில் என்னிடம் இங்கு இல்லை. உங்கள் திட்ட முடிவுகளில் இதே தகவல் உள்ளது, ஒவ்வொன்றையும் தீர்மானித்த விதியுடன்."

