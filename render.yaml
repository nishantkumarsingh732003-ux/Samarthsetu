# Render blueprint for the SamarthSetu API, its database and its cache.
#
# Not deployed. Checked in so the deploy is one deliberate action by whoever owns the
# account, rather than something that happened quietly during a build.
#
# Two manual steps Render will not do, both in docs/DEPLOYMENT.md:
#   1. CREATE EXTENSION postgis; CREATE EXTENSION vector;  -- once, on the database
#   2. python /scripts/seed/run.py                          -- migrations run themselves, data does not
services:
  - type: web
    name: setu-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    region: singapore          # closest Render region to the citizens this serves
    # Free tier. It sleeps after ~15 minutes idle and cold-starts in roughly a minute, so
    # warm it with a request before any demo — see docs/DEPLOYMENT.md.
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: setu-postgres, property: connectionString }
      - key: REDIS_URL
        fromService: { name: setu-redis, type: redis, property: connectionString }
      - key: ENVIRONMENT
        value: production
      # Generated by Render and never printed. Rotating ID_HASH_SALT invalidates every
      # existing government-ID hash — deliberately; see docs/DEPLOYMENT.md.
      - key: SECRET_KEY
        generateValue: true
      - key: ID_HASH_SALT
        generateValue: true
      - key: SEED_PASSWORD
        generateValue: true
      # Must be the real web origin. A wildcard would let any site call this API.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      # `none` is fully supported: eligibility does not depend on a model, and
      # `make chaos` proves the whole journey completes without one.
      - key: LLM_PROVIDER
        value: none
      - key: NOTIFICATION_DRIVER
        value: database
      - key: LOG_JSON
        value: "true"
      # Redacted document bytes, on the container filesystem. `storage.py` creates the
      # directory, so this works with no disk attached — but the files are EPHEMERAL and
      # vanish on every redeploy and every wake from sleep.
      #
      # A persistent disk is not available on the free plan. For anything beyond a demo,
      # move to a paid plan and restore the `disk:` block, or swap
      # app/services/storage.py for object storage — it is a four-function module behind
      # exactly that seam.
      - key: STORAGE_DIR
        value: /data/uploads

  - type: redis
    name: setu-redis
    region: singapore
    plan: free
    maxmemoryPolicy: allkeys-lru   # sessions and the routing cache are both disposable
    ipAllowList: []

databases:
  - name: setu-postgres
    region: singapore
    # Render's free database is time-limited — confirm the current expiry on their
    # pricing page before relying on it past a demo. When it lapses the API keeps
    # answering `/health` while every query fails, so check `/readyz`, not `/health`.
    plan: free
    postgresMajorVersion: "16"
